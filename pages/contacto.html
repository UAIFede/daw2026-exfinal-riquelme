<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - memoJuego</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <div class="marca-sitio">
            <span class="nombre-sitio">memoJuego</span>
        </div>
        <nav class="navegacion" aria-label="Navegación principal">
            <a class="enlace-nav" href="../index.html">Juego</a>
            <a class="enlace-nav enlace-nav-activo" href="contacto.html">Contacto</a>
        </nav>
        <div class="acciones-encabezado">
            <button class="boton-icono" id="boton-tema" type="button" aria-label="Cambiar entre modo claro y oscuro">
                <img class="icono-boton" src="../assets/imagenes/luna.svg" alt="" aria-hidden="true">
            </button>
        </div>
    </header>

    <main class="contenido">
        <section class="pantalla vista-contacto" aria-labelledby="titulo-contacto">
            <h1 class="titulo-pantalla" id="titulo-contacto">Contacto</h1>
            <p class="texto-pantalla">¿Tenés una sugerencia o encontraste un error? Escribinos y se abrirá tu cliente de correo.</p>

            <form class="formulario-contacto" id="formulario-contacto" novalidate>
                <div class="campo">
                    <label class="etiqueta-campo" for="contacto-nombre">Nombre</label>
                    <input class="control-campo" id="contacto-nombre" type="text" placeholder="Tu nombre" autocomplete="off">
                    <p class="error-campo" id="error-contacto-nombre" role="alert"></p>
                </div>

                <div class="campo">
                    <label class="etiqueta-campo" for="contacto-mail">Mail</label>
                    <input class="control-campo" id="contacto-mail" type="text" placeholder="tucorreo@ejemplo.com" autocomplete="off">
                    <p class="error-campo" id="error-contacto-mail" role="alert"></p>
                </div>

                <div class="campo">
                    <label class="etiqueta-campo" for="contacto-mensaje">Mensaje</label>
                    <textarea class="control-campo control-campo-area" id="contacto-mensaje" rows="5" placeholder="Contanos en qué podemos ayudarte"></textarea>
                    <p class="error-campo" id="error-contacto-mensaje" role="alert"></p>
                </div>

                <p class="exito-campo" id="exito-contacto" role="status"></p>

                <button class="boton boton-primario" id="boton-enviar" type="submit">Enviar mensaje</button>
            </form>
        </section>
    </main>

    <footer class="pie">
        <p class="texto-pie">Proyecto Final · Desarrollo y Arquitecturas Web · 2026</p>
        <div class="enlaces-pie">
            <a class="enlace-pie" id="enlace-repositorio" href="https://github.com/UAIFede/daw2026-exfinal-riquelme" target="_blank" rel="noopener noreferrer">Repositorio en GitHub</a>
            <a class="enlace-pie" id="enlace-pages" href="https://uaifede.github.io/daw2026-exfinal-riquelme/" target="_blank" rel="noopener noreferrer">Ver en GitHub Pages</a>
        </div>
    </footer>
    <script src="../js/validaciones.js"></script>
    <script src="../js/contacto.js"></script>
    <script src="../js/almacenamiento.js"></script>
</body>
</html>
